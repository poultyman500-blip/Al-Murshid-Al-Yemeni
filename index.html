<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A responsive weather dashboard powered by Open-Meteo." />
  <title>SkyCast Weather Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">LIVE WEATHER</p>
        <h1>SkyCast</h1>
      </div>
      <form id="search-form" class="search" role="search">
        <label class="sr-only" for="city-input">Search city</label>
        <input id="city-input" name="city" type="search" placeholder="Search a city…" autocomplete="off" />
        <button type="submit" aria-label="Search">Search</button>
      </form>
      <button id="unit-toggle" class="unit-toggle" type="button" aria-label="Toggle temperature unit">°C</button>
    </header>

    <div id="error" class="error" role="alert" hidden></div>
    <section id="loading" class="loading" aria-live="polite">Loading weather…</section>

    <div id="dashboard" hidden>
      <section class="hero card">
        <div>
          <p class="muted" id="updated-at">Updated just now</p>
          <h2 id="location-name">—</h2>
          <p class="muted" id="coordinates">—</p>
          <div class="current-temp"><span id="current-icon">☀️</span><strong id="current-temp">—</strong><span class="degree">°</span></div>
          <p class="condition" id="current-condition">—</p>
        </div>
        <div class="hero-stats">
          <div><span>Feels like</span><strong id="feels-like">—</strong></div>
          <div><span>Humidity</span><strong id="humidity">—</strong></div>
          <div><span>Wind</span><strong id="wind">—</strong></div>
        </div>
      </section>

      <section class="section-block">
        <div class="section-heading"><h2>Hourly forecast</h2><span class="muted">Next 24 hours</span></div>
        <div id="hourly" class="hourly-grid"></div>
      </section>

      <section class="section-block">
        <div class="section-heading"><h2>7-day forecast</h2><span class="muted">Daily outlook</span></div>
        <div id="daily" class="daily-list"></div>
      </section>

      <section class="details-grid">
        <article class="card detail-card"><span class="detail-icon">🌅</span><div><span>Sunrise</span><strong id="sunrise">—</strong></div></article>
        <article class="card detail-card"><span class="detail-icon">🌇</span><div><span>Sunset</span><strong id="sunset">—</strong></div></article>
        <article class="card detail-card"><span class="detail-icon">☔</span><div><span>Rain chance</span><strong id="rain">—</strong></div></article>
        <article class="card detail-card"><span class="detail-icon">💨</span><div><span>Wind direction</span><strong id="wind-direction">—</strong></div></article>
      </section>
    </div>
    <footer>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a></footer>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
